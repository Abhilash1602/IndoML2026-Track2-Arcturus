# Hyperparameters of the shipped Track 2 models (the exact commands are in train/run_training.sh).

data:
  sample_rate: 16000
  organiser_pairs: {fit: 591, held_out: 104}          # train/ft_data_lists.json
  clean_speech: [591 organiser references, 3968 Gold event-free spans (data/bank/clean)]
  noise: [1863 organiser noise events (noisy - clean), FSD50K CC0/CC-BY + MUSAN rfm (data/ext_noise), p_ext 0.5]
  recipe:                                            # measured on the organiser pairs (train/synth_recipe_rows.json)
    events_per_crop: [1, 2, 3, 4, 4]                  # drawn uniformly from this list
    event_duration_s: [0.2, 1.1]
    event_snr_db: empirical list, median -7.5
    low_snr_tail: {prob: 0.5, max_db: 5}              # rounds 5 and partial-noise members only
  augmentation:
    noise_speed: [0.9, 1.1]
    noise_polarity_flip: 0.5
    overlapping_event_prob: 0.15
    speech_gain: [0.5, 1.5]
  crop_s: 3                                           # 12 for the long-crop MossFormer2 members

separators:
  optimiser: {type: AdamW, weight_decay: 1.0e-4, schedule: cosine to lr/20, grad_clip: 5.0}
  batch: 2
  loss:
    ab_si_sdr: {alpha: 2.0, whole_crop: 1.0, event_region: 1.0, event_dilation_s: 0.1}
    compressed_magnitude_mse: 0.5                     # MossFormerGAN
    sravaani_feature_l1: {weights: [1, 3, 5, 10], frames: event frames only}
    partial_noise_target_g: 0.2                       # pnt20, pntres20
  members:
    mossformergan: {lr: [1.0e-5, 2.0e-5], steps: [3000, 4000, 8000], window_s: 6}
    mossformergan_res: {lr: [5.0e-5, 2.0e-5], steps: [4000, 3000], heads_zero_init: true, window_s: 6}
    mossformer2_se: {lr: 1.0e-5, steps: [4000, 2500, 2000], window_s: 3}
    mossformer2_ss: {lr: 1.0e-5, steps: [4000, 3000], batch: [1, 2], window_s: 2}

fusion:
  stft: {n_fft: 512, hop: 128, window: hann}
  network: {channels: 64, dilations: [1, 2, 4, 8, 16, 1, 2, 4, 8, 16], norm: GroupNorm(4), act: PReLU, params: 0.38M}
  cache_mixtures: [3000, 6000]
  optimiser: {type: AdamW, lr: [1.0e-3, 5.0e-4], batch: 8, steps: [4000, 5000, 6000]}
  loss: {ab_si_sdr_alpha: 2.0, sravaani_feature_weight: [1.0, 3.0]}
  final_average: {fu6: 0.4, fu4: 0.2, fu2: 0.2, fu3l: 0.2}

inference:
  event_margin_s: 0.1
  ramp_ms: 10
  outside_event_mix: 0.5                              # 0.5 * model + 0.5 * input outside detected events
  peak_guard: 0.99
  output: 16-bit PCM WAV, 16 kHz mono
